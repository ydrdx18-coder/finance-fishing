<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融捕魚 Firebase版</title>
<style>
body{font-family:system-ui,"Noto Sans TC";background:#071522;color:white;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#10263a;border:1px solid #31516a;border-radius:16px;padding:18px;margin:12px 0}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:11px;border-radius:9px;border:1px solid #52718a;background:#16344c;color:white;font-size:16px}button{cursor:pointer}.go{background:#08785c}.gold{background:#756019}.code{text-align:center;font-size:44px;color:#ffd35a;font-weight:bold;letter-spacing:7px}.team{padding:13px;border:1px solid #31516a;border-radius:12px}.active{outline:3px solid #16b98c}.score{font-size:30px;color:#ffd35a;font-weight:bold}.event{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #52718a;border-radius:14px}.big{font-size:60px}.log{max-height:250px;overflow:auto}.rank{padding:9px;border-bottom:1px solid #31516a;font-size:20px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section id="home" class="card"><h1>🎣 金融捕魚｜Firebase 即時同步正式版</h1><p id="status">🔄 連線中…</p><div class="row"><button class="go" onclick="teacherSetup()">👨‍🏫 教師版</button><button onclick="studentSetup()">📱 學生版</button></div></section>
<section id="setupT" class="card hide"><h2>建立課堂</h2><div id="names" class="grid"></div><br><button class="go" onclick="createRoom()">🚀 建立課堂</button></section>
<section id="setupS" class="card hide"><h2>加入課堂</h2><div class="row"><input id="code" maxlength="4" placeholder="4碼課堂代碼"><select id="myTeam"></select><button class="go" onclick="joinRoom()">加入</button></div></section>
<section id="teacher" class="hide"><div class="card"><div>課堂代碼</div><div id="roomCode" class="code"></div><button onclick="copyCode()">📋 複製代碼</button> <button onclick="copyLink()">🔗 複製學生網址</button></div>
<div class="card"><h2 id="phase"></h2><div class="row"><button class="go" onclick="startGame()">▶️ 開始第一階段</button><button onclick="setPause(true)">⏸️ 暫停</button><button onclick="setPause(false)">▶️ 繼續</button><button class="gold" onclick="nextStep()">➡️ 下一步</button></div></div>
<div class="card"><h2>🎬 最新事件</h2><div id="event" class="event"></div></div><div class="card"><h2>🏆 六組狀態</h2><div id="teams" class="grid"></div></div>
<div id="skills" class="card hide"></div><div class="card"><h2>📜 紀錄</h2><div id="logs" class="log"></div></div><div id="final" class="card hide"></div></section>
<section id="student" class="hide"><div class="card"><h2 id="studentName"></h2><div id="studentInfo"></div></div><div class="card"><h2>🎣 本回合操作</h2><div id="controls"></div></div><div class="card"><h2>🎬 我的結果</h2><div id="myEvent" class="event"></div></div></section>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,push,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCekJnvbUpTD9X-xuxFqHDMEiZwdvWk5e8",authDomain:"finance-fishing-class-28d7f.firebaseapp.com",databaseURL:"https://finance-fishing-class-28d7f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"finance-fishing-class-28d7f",storageBucket:"finance-fishing-class-28d7f.firebasestorage.app",messagingSenderId:"470819055501",appId:"1:470819055501:web:da712d256be39f23adffc4"};
const db=getDatabase(initializeApp(firebaseConfig));let room="",role="",me=-1,s=null;const $=x=>document.getElementById(x);
const seas={pacific:["太平洋",[25,25,20,15,10,5]],atlantic:["大西洋",[10,25,30,20,10,5]],indian:["印度洋",[20,15,15,15,15,10]]};
const icons=["🫧","🐟","🐟🐟","🐟🐟🐟","🐠🐠🐠🐠","🐠🐠🐠🐠🐠","🐡🐡🐡🐡🐡🐡"];
function hide(){["home","setupT","setupS","teacher","student"].forEach(x=>$(x).classList.add("hide"))}
window.teacherSetup=()=>{hide();$("setupT").classList.remove("hide");$("names").innerHTML=[0,1,2,3,4,5].map(i=>`<input id="n${i}" placeholder="第${i+1}組名稱">`).join("")};
window.studentSetup=()=>{hide();$("setupS").classList.remove("hide");$("myTeam").innerHTML=[0,1,2,3,4,5].map(i=>`<option value="${i}">第${i+1}組</option>`).join("")};
function blank(){let t={};for(let i=0;i<6;i++)t[i]={name:`第${i+1}組`,fish:0,capacity:10,attempts:0,tech:0,expert:0,ship:0,connected:false,carry:0};return{code:room,phase:"setup",round:0,turn:0,paused:true,teams:t,last:null}}
function listen(){onValue(ref(db,"rooms/"+room),v=>{if(v.exists()){s=v.val();render()}});$("status").textContent="🟢 Firebase 已連線"}
window.createRoom=async()=>{room=Math.random().toString(36).slice(2,6).toUpperCase();let x=blank();for(let i=0;i<6;i++)x.teams[i].name=$("n"+i).value.trim()||`第${i+1}組`;await set(ref(db,"rooms/"+room),x);role="teacher";hide();$("teacher").classList.remove("hide");listen()};
window.joinRoom=async()=>{room=$("code").value.trim().toUpperCase();let v=await get(ref(db,"rooms/"+room));if(!v.exists())return alert("找不到課堂");me=+$("myTeam").value;await update(ref(db,`rooms/${room}/teams/${me}`),{connected:true});role="student";hide();$("student").classList.remove("hide");listen()};
const reset=()=>{let t={};Object.keys(s.teams).forEach(i=>t[i]={...s.teams[i],attempts:0,carry:0});return t};
async function log(x){await push(ref(db,`rooms/${room}/log`),{text:x,time:serverTimestamp()})}
window.startGame=async()=>{await update(ref(db,"rooms/"+room),{phase:"p1",round:1,turn:0,paused:false,teams:reset()});await log("🎬 第一階段開始")};
window.setPause=async x=>update(ref(db,"rooms/"+room),{paused:x});
window.nextStep=async()=>{if(s.phase==="p1"&&s.round===3){await update(ref(db,"rooms/"+room),{phase:"training",paused:true});await log("🎓 技能訓練")}else if(s.phase==="training"){await update(ref(db,"rooms/"+room),{phase:"p2",round:1,turn:0,paused:false,teams:reset()})}else if(s.phase==="p2"&&(s.round===3||s.round===6)){await update(ref(db,"rooms/"+room),{phase:"upgrade",paused:true})}else if(s.phase==="upgrade"){await update(ref(db,"rooms/"+room),{phase:"p2",round:+s.round+1,turn:0,paused:false,teams:reset()})}else if(s.phase==="p2"&&s.round<9){await update(ref(db,"rooms/"+room),{round:+s.round+1,turn:0,paused:false,teams:reset()})}else if(s.phase==="p2"){await update(ref(db,"rooms/"+room),{phase:"end",paused:true})}};
function pick(a){let r=Math.random()*100,z=0;for(let i=0;i<a.length;i++){z+=a[i];if(r<z)return i}return 0}
window.catchFish=async()=>{if(s.paused||!["p1","p2"].includes(s.phase))return alert("目前不是捕魚時間");if(+s.turn!==me)return alert("尚未輪到你的組");let t={...s.teams[me]},max=3+(+t.tech||0);if(t.attempts>=max)return alert("本回合次數已用完");let k=$("sea").value,n=pick(seas[k][1]);t.attempts++;t.carry+=n;let e={type:"fish",team:t.name,n,icon:icons[n],sea:seas[k][0],attempt:t.attempts,max};if(s.phase==="p2"&&t.carry>t.capacity){e={type:"pirate",team:t.name};t.carry=0;t.attempts=0;await log(`🏴‍☠️ ${t.name} 海盜掠奪，本回合0條魚`)}else await log(`🎣 ${t.name}｜${seas[k][0]}｜${icons[n]} ${n}條`);let turn=+s.turn;if(t.attempts>=max){t.fish+=t.carry;t.carry=0;t.attempts=0;turn=(turn+1)%6}else if(e.type==="pirate")turn=(turn+1)%6;await update(ref(db,`rooms/${room}/teams/${me}`),t);await update(ref(db,"rooms/"+room),{last:e,turn})};
window.buySkill=async(i,k)=>{if(role==="student"&&i!==me)return;let c={expert:5,tech:8,ship:10}[k],t={...s.teams[i]};if(!["training","upgrade"].includes(s.phase)||t.fish<c)return alert("目前不能購買或魚不夠");t.fish-=c;if(k==="expert")t.expert++;if(k==="tech")t.tech++;if(k==="ship"){t.ship++;t.capacity++}await update(ref(db,`rooms/${room}/teams/${i}`),t);await log(`🎓 ${t.name} 技能升級`)};
function phase(){return s.phase==="p1"?`第一階段｜第${s.round}/3回合`:s.phase==="p2"?`第二階段｜第${s.round}/9回合`:s.phase==="training"?"🎓 第一階段技能訓練":s.phase==="upgrade"?`⬆️ 第${s.round}回合技能升級`:s.phase==="end"?"🏆 遊戲結束":"準備開始"}
function event(e){if(!e)return"🃏 等待抽牌";if(e.type==="pirate")return`<div><div class=big>🏴‍☠️🏴‍☠️🏴‍☠️</div><b>海盜掠奪！</b><p>${e.team}<br>本回合帶回 0 條魚</p></div>`;return`<div><div class=big>${e.icon}</div><b>抽到 ${e.n} 條魚！</b><p>${e.team}｜🌊${e.sea}<br>第${e.attempt}/${e.max}次</p></div>`}
async function render(){if(role==="teacher"){$("roomCode").textContent=s.code;$("phase").textContent=phase();$("event").innerHTML=event(s.last);$("teams").innerHTML=Object.keys(s.teams).map(i=>{let t=s.teams[i];return`<div class="team ${+i===+s.turn&&["p1","p2"].includes(s.phase)?"active":""}"><b>${t.name}</b> ${t.connected?"🟢":"⚪"}<div class=score>${t.fish}🐟</div>第${s.round}回合｜${t.attempts}/${3+t.tech}次<br>🚢乘載${t.capacity}<br>🌊${t.expert}｜🎣${t.tech}｜🚢${t.ship}</div>`}).join("");let l=await get(ref(db,`rooms/${room}/log`));$("logs").innerHTML=l.exists()?Object.values(l.val()).map(x=>`<div>• ${x.text}</div>`).join(""):"尚無紀錄";let sk=$("skills");if(["training","upgrade"].includes(s.phase)){sk.classList.remove("hide");sk.innerHTML="<h2>🎓 技能</h2>"+Object.keys(s.teams).map(i=>`<p><b>${s.teams[i].name}</b>｜${s.teams[i].fish}🐟 <button onclick="buySkill(${i},'expert')">🌊5</button><button onclick="buySkill(${i},'tech')">🎣8</button><button onclick="buySkill(${i},'ship')">🚢10</button></p>`).join("")}else sk.classList.add("hide");if(s.phase==="end"){$("final").classList.remove("hide");$("final").innerHTML="<h2>🏆 最終排名</h2>"+Object.values(s.teams).sort((a,b)=>b.fish-a.fish).map((t,i)=>`<div class=rank>${i+1}. ${t.name}　${t.fish}🐟</div>`).join("")}}else{let t=s.teams[me];$("studentName").textContent=t.name;$("studentInfo").innerHTML=`${phase()}<br>第${t.attempts}/${3+t.tech}次｜${t.fish}🐟｜🚢${t.capacity}<br>${+s.turn===me?"🟢 現在輪到你":"⏳ 等待其他組"}`;if(["p1","p2"].includes(s.phase))$("controls").innerHTML=`<select id=sea><option value=pacific>🌊太平洋</option><option value=atlantic>🌊大西洋</option><option value=indian>🌊印度洋</option></select> <button class=go onclick="catchFish()">🎣 抽魚牌</button>`;else if(["training","upgrade"].includes(s.phase))$("controls").innerHTML=`<button onclick="buySkill(${me},'expert')">🌊海洋生態專家5🐟</button><button onclick="buySkill(${me},'tech')">🎣捕魚技術指導8🐟</button><button onclick="buySkill(${me},'ship')">🚢增建船舶工程10🐟</button>`;else $("controls").innerHTML="等待教師操作";$("myEvent").innerHTML=s.last&&s.last.team===t.name?event(s.last):"🃏 等待你的抽牌結果"}}
window.copyCode=()=>{navigator.clipboard?.writeText(s.code);alert(s.code)};window.copyLink=()=>{navigator.clipboard?.writeText(location.href.split("#")[0]+"#join="+s.code);alert("學生網址已複製")};
</script></body></html>
