<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融捕魚 Firebase版</title>
<style>
body{font-family:system-ui,"Noto Sans TC";background:#071522;color:white;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#10263a;border:1px solid #31516a;border-radius:16px;padding:18px;margin:12px 0}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select{padding:11px;border-radius:9px;border:1px solid #52718a;background:#16344c;color:white;font-size:16px}button{cursor:pointer}.go{background:#08785c}.gold{background:#756019}.code{text-align:center;font-size:44px;color:#ffd35a;font-weight:bold;letter-spacing:7px}.team{padding:13px;border:1px solid #31516a;border-radius:12px}.active{outline:3px solid #16b98c}.score{font-size:30px;color:#ffd35a;font-weight:bold}.probgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.probbox{border:1px solid #31516a;border-radius:12px;padding:12px}.probbox label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}.probbox input{width:70px;padding:7px}.probSum{font-weight:bold;margin-top:8px}.event{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #52718a;border-radius:14px}.big{font-size:60px}.log{max-height:250px;overflow:auto}.rank{padding:9px;border-bottom:1px solid #31516a;font-size:20px}@media(max-width:800px){.probgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section id="home" class="card"><h1>🎣 金融捕魚｜Firebase 即時同步正式版</h1><p id="status">🔄 連線中…</p><div class="row"><button class="go" onclick="teacherSetup()">👨‍🏫 教師版</button><button onclick="studentSetup()">📱 學生版</button></div></section>
<section id="setupT" class="card hide"><h2>建立課堂</h2><div id="names" class="grid"></div><br><button class="go" onclick="createRoom()">🚀 建立課堂</button></section>
<section id="setupS" class="card hide"><h2>加入課堂</h2><div class="row"><input id="code" maxlength="4" placeholder="4碼課堂代碼"><select id="myTeam"></select><button class="go" onclick="joinRoom()">加入</button></div></section>
<section id="teacher" class="hide"><div class="card"><div>課堂代碼</div><div id="roomCode" class="code"></div><button onclick="copyCode()">📋 複製代碼</button> <button onclick="copyLink()">🔗 複製學生網址</button></div>
<div class="card"><h2 id="phase"></h2><div class="row"><button class="go" onclick="startGame()">▶️ 開始／重新開始第一階段</button><button onclick="setPause(true)">⏸️ 暫停</button><button onclick="setPause(false)">▶️ 繼續</button><button class="gold" onclick="nextStep()">➡️ 下一步</button></div></div>
<div id="probSettings" class="card"></div><div class="card"><h2>🎬 最新事件</h2><div id="event" class="event"></div></div><div class="card"><h2>🏆 六組狀態</h2><div id="teams" class="grid"></div></div>
<div id="skills" class="card hide"></div><div class="card"><h2>📜 紀錄</h2><div id="logs" class="log"></div></div><div id="final" class="card hide"></div></section>
<section id="student" class="hide"><div class="card"><h2 id="studentName"></h2><div id="studentInfo"></div></div><div class="card"><h2>🎣 本回合操作</h2><div id="controls"></div></div><div class="card"><h2>🎬 我的結果</h2><div id="myEvent" class="event"></div></div></section>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,push,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCekJnvbUpTD9X-xuxFqHDMEiZwdvWk5e8",authDomain:"finance-fishing-class-28d7f.firebaseapp.com",databaseURL:"https://finance-fishing-class-28d7f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"finance-fishing-class-28d7f",storageBucket:"finance-fishing-class-28d7f.firebasestorage.app",messagingSenderId:"470819055501",appId:"1:470819055501:web:da712d256be39f23adffc4"};
const db=getDatabase(initializeApp(firebaseConfig));let room="",role="",me=-1,s=null;const $=x=>document.getElementById(x);
const seas={pacific:["太平洋"],atlantic:["大西洋"],indian:["印度洋"]};
const defaultProb={p1:{pacific:[10,20,25,20,15,10,0],atlantic:[10,25,30,20,10,5,0],indian:[15,15,20,20,15,15,0]},p2:{pacific:[8,12,18,22,18,14,8],atlantic:[10,20,25,20,12,8,5],indian:[15,12,15,18,16,14,10]}};
function getProb(){return s&&s.prob?s.prob:defaultProb}
const icons=["🫧","🐟","🐟🐟","🐟🐟🐟","🐠🐠🐠🐠","🐠🐠🐠🐠🐠","🐡🐡🐡🐡🐡🐡"];
function hide(){["home","setupT","setupS","teacher","student"].forEach(x=>$(x).classList.add("hide"))}
window.teacherSetup=()=>{hide();$("setupT").classList.remove("hide");$("names").innerHTML=[0,1,2,3,4,5].map(i=>`<input id="n${i}" placeholder="第${i+1}組名稱">`).join("")};
window.studentSetup=()=>{hide();$("setupS").classList.remove("hide");$("myTeam").innerHTML=[0,1,2,3,4,5].map(i=>`<option value="${i}">第${i+1}組</option>`).join("")};
function blank(){let t={};for(let i=0;i<6;i++)t[i]={name:`第${i+1}組`,fish:0,capacity:10,attempts:0,tech:0,expert:0,ship:0,connected:false,carry:0};return{code:room,phase:"setup",round:0,turn:0,paused:true,prob:JSON.parse(JSON.stringify(defaultProb)),teams:t,last:null}}
function listen(){onValue(ref(db,"rooms/"+room),v=>{if(v.exists()){s=v.val();render()}});$("status").textContent="🟢 Firebase 已連線"}
window.createRoom=async()=>{room=Math.random().toString(36).slice(2,6).toUpperCase();let x=blank();for(let i=0;i<6;i++)x.teams[i].name=$("n"+i).value.trim()||`第${i+1}組`;await set(ref(db,"rooms/"+room),x);role="teacher";hide();$("teacher").classList.remove("hide");listen()};
window.joinRoom=async()=>{room=$("code").value.trim().toUpperCase();let v=await get(ref(db,"rooms/"+room));if(!v.exists())return alert("找不到課堂");me=+$("myTeam").value;await update(ref(db,`rooms/${room}/teams/${me}`),{connected:true});role="student";hide();$("student").classList.remove("hide");listen()};
const reset=()=>{let t={};Object.keys(s.teams).forEach(i=>t[i]={...s.teams[i],attempts:0,carry:0});return t};
async function log(x){await push(ref(db,`rooms/${room}/log`),{text:x,time:serverTimestamp()})}
window.startGame=async()=>{await update(ref(db,"rooms/"+room),{phase:"p1",round:1,turn:0,paused:false,teams:reset()});await log("🎬 第一階段開始")};
window.setPause=async x=>update(ref(db,"rooms/"+room),{paused:x});
window.nextStep=async()=>{if(s.phase==="p1"&&+s.round===3){await update(ref(db,"rooms/"+room),{phase:"training",paused:true,turn:0});await log("🎓 第一階段結束，進入技能訓練")}else if(s.phase==="training"){await update(ref(db,"rooms/"+room),{phase:"p2",round:1,turn:0,paused:false,teams:reset()});await log("🚀 第二階段開始")}else if(s.phase==="p2"&&(+s.round===3||+s.round===6)){await update(ref(db,"rooms/"+room),{phase:"upgrade",paused:true,turn:0});await log(`🎓 第${s.round}回合結束，進入技能升級`)}else if(s.phase==="upgrade"){const next=+s.round+1;await update(ref(db,"rooms/"+room),{phase:"p2",round:next,turn:0,paused:false,teams:reset()});await log(`🚀 第二階段第${next}回合開始`)}else if(s.phase==="p2"&&+s.round===9){await update(ref(db,"rooms/"+room),{phase:"end",paused:true});await log("🏆 遊戲結束")}else if(s.phase==="p2"&&+s.round<9){const next=+s.round+1;await update(ref(db,"rooms/"+room),{round:next,turn:0,paused:false,teams:reset()})}};
function pick(a){let total=a.reduce((x,y)=>x+(Number(y)||0),0);let r=Math.random()*total,z=0;for(let i=0;i<a.length;i++){z+=Number(a[i])||0;if(r<z)return i}return a.length-1}
window.catchFish=async()=>{if(s.paused||!["p1","p2"].includes(s.phase))return alert("目前不是捕魚時間");if(+s.turn!==me)return alert("尚未輪到你的組");let t={...s.teams[me]},max=3+(+t.tech||0);if(t.attempts>=max)return alert("本回合次數已用完");let k=$("sea").value,ph=s.phase,table=(getProb()[ph][k]||[]).slice(0,ph==="p1"?6:7),n=pick(table);t.attempts++;t.carry+=n;let e={type:"fish",team:t.name,n,icon:icons[n],sea:seas[k][0],attempt:t.attempts,max};if(ph==="p2"&&t.carry>t.capacity){e={type:"pirate",team:t.name};t.carry=0;t.attempts=max;await log(`🏴‍☠️ ${t.name} 海盜掠奪，本回合0條魚`)}else await log(`🎣 ${t.name}｜${seas[k][0]}｜${icons[n]} ${n}條`);let teams={...s.teams};if(t.attempts>=max){t.fish+=t.carry;t.carry=0;t.attempts=0;teams[me]=t;let nextTurn=(+s.turn+1)%6;let roomUpdate={last:e,turn:nextTurn,teams};if(nextTurn===0){if(ph==="p1"&&+s.round<3){roomUpdate.round=+s.round+1;roomUpdate.teams=Object.fromEntries(Object.entries(teams).map(([i,x])=>[i,{...x,attempts:0,carry:0}]));await log(`📣 第一階段第${+s.round+1}回合開始`)}else if(ph==="p1"&&+s.round===3){roomUpdate.paused=true;await log("📣 第一階段三回合完成，請教師按「下一步」進入技能訓練")}else if(ph==="p2"&&[3,6,9].includes(+s.round)){roomUpdate.paused=true;await log(`📣 第二階段第${s.round}回合完成，請教師按「下一步」`)}else if(ph==="p2"&&+s.round<9){roomUpdate.round=+s.round+1;roomUpdate.teams=Object.fromEntries(Object.entries(teams).map(([i,x])=>[i,{...x,attempts:0,carry:0}]));await log(`📣 第二階段第${+s.round+1}回合開始`)}}await update(ref(db,"rooms/"+room),roomUpdate)}else{teams[me]=t;let nextTurn=+s.turn;if(e.type==="pirate")nextTurn=(nextTurn+1)%6;await update(ref(db,`rooms/${room}/teams/${me}`),t);await update(ref(db,"rooms/"+room),{last:e,turn:nextTurn})}};
window.buySkill=async(i,k)=>{if(!s||!s.teams||!s.teams[i])return alert("課堂資料尚未載入，請稍後再試");if(role==="student"&&i!==me)return alert("只能替自己的組別購買技能");if(!["training","upgrade"].includes(s.phase))return alert("目前不是技能訓練／升級階段");const costs={expert:5,tech:8,ship:10},labels={expert:"海洋生態專家",tech:"捕魚技術指導",ship:"增建船舶工程"},c=costs[k];if(!c)return alert("技能設定錯誤");let t={...s.teams[i]};if(Number(t.fish)<c)return alert(`${labels[k]}需要${c}條魚，目前只有${t.fish}條`);t.fish=Number(t.fish)-c;if(k==="expert")t.expert=(+t.expert||0)+1;if(k==="tech")t.tech=(+t.tech||0)+1;if(k==="ship"){t.ship=(+t.ship||0)+1;t.capacity=(+t.capacity||10)+1}await update(ref(db,`rooms/${room}/teams/${i}`),t);await log(`🎓 ${t.name} 購買「${labels[k]}」成功（-${c}條魚）`)};
function phase(){return s.phase==="p1"?`第一階段｜第${s.round}/3回合`:s.phase==="p2"?`第二階段｜第${s.round}/9回合`:s.phase==="training"?"🎓 第一階段技能訓練":s.phase==="upgrade"?`⬆️ 第${s.round}回合技能升級`:s.phase==="end"?"🏆 遊戲結束":"準備開始"}
function event(e){if(!e)return"🃏 等待抽牌";if(e.type==="pirate")return`<div><div class=big>🏴‍☠️🏴‍☠️🏴‍☠️</div><b>海盜掠奪！</b><p>${e.team}<br>本回合帶回 0 條魚</p></div>`;return`<div><div class=big>${e.icon}</div><b>抽到 ${e.n} 條魚！</b><p>${e.team}｜🌊${e.sea}<br>第${e.attempt}/${e.max}次</p></div>`}
window.saveProb=async()=>{
 let np={p1:{},p2:{}};
 for(const ph of ["p1","p2"]){
  for(const k of Object.keys(seas)){
   np[ph][k]=[];
   const max=ph==="p1"?6:7;
   for(let i=0;i<7;i++){const el=$(`prob-${ph}-${k}-${i}`);np[ph][k][i]=i<max?Math.max(0,Math.min(100,Number(el&&el.value)||0)):0;}
   const sum=np[ph][k].reduce((a,b)=>a+b,0);
   if(sum!==100){alert(`${ph==="p1"?"第一階段":"第二階段"}｜${seas[k][0]} 合計為 ${sum}%，必須等於100%。`);return;}
  }
 }
 await update(ref(db,"rooms/"+room),{prob:np});
 await log("⚙️ 教師已更新三海域魚牌機率");
 renderProbPanel();
};
window.resetProb=()=>{renderProbPanel(defaultProb);};
function renderProbPanel(temp){
 if(role!=="teacher")return;
 const p=temp||getProb();
 let out='<h2>⚙️ 海域機率設定</h2><p>老師可自行調整三個海域的魚牌機率；每個海域合計必須為100%。</p>';
 for(const ph of ["p1","p2"]){
  out+=`<h3>${ph==="p1"?"第一階段｜0～5條魚":"第二階段｜0～6條魚"}</h3><div class="probgrid">`;
  for(const k of Object.keys(seas)){
   out+=`<div class="probbox"><b>🌊 ${seas[k][0]}</b>`;
   for(let i=0;i<7;i++){const disabled=ph==="p1"&&i===6?"disabled":"";out+=`<label>${icons[i]} ${i}條 <input type="number" min="0" max="100" value="${p[ph][k][i]||0}" id="prob-${ph}-${k}-${i}" ${disabled}>%</label>`;}
   out+=`<div class="probSum" id="sum-${ph}-${k}">合計：${(p[ph][k]||[]).reduce((a,b)=>a+(Number(b)||0),0)}%</div></div>`;
  }
  out+='</div>';
 }
 out+='<div class="row"><button class="go" onclick="saveProb()">💾 儲存機率設定</button><button onclick="resetProb()">↩️ 還原預設值</button></div><p>儲存後會寫入 Firebase，所有學生即時使用新機率。</p>';
 $("probSettings").innerHTML=out;
}
async function render(){if(role==="teacher"){$("roomCode").textContent=s.code;$("phase").textContent=phase();$("event").innerHTML=event(s.last);$("teams").innerHTML=Object.keys(s.teams).map(i=>{let t=s.teams[i];return`<div class="team ${+i===+s.turn&&["p1","p2"].includes(s.phase)?"active":""}"><b>${t.name}</b> ${t.connected?"🟢":"⚪"}<div class=score>${t.fish}🐟</div>第${s.round}回合｜${t.attempts}/${3+t.tech}次<br>🚢乘載${t.capacity}<br>🌊${t.expert}｜🎣${t.tech}｜🚢${t.ship}</div>`}).join("");renderProbPanel();let l=await get(ref(db,`rooms/${room}/log`));$("logs").innerHTML=l.exists()?Object.values(l.val()).map(x=>`<div>• ${x.text}</div>`).join(""):"尚無紀錄";let sk=$("skills");if(["training","upgrade"].includes(s.phase)){sk.classList.remove("hide");sk.innerHTML="<h2>🎓 技能購買／升級</h2><p>海洋生態專家 5🐟｜捕魚技術指導 8🐟｜增建船舶工程 10🐟</p>"+Object.keys(s.teams).map(i=>`<p><b>${s.teams[i].name}</b>｜魚量：${s.teams[i].fish}🐟｜承載：${s.teams[i].capacity}｜已購買：專家${s.teams[i].expert}、技術${s.teams[i].tech}、船舶${s.teams[i].ship}<br><button onclick="buySkill(${i},'expert')">🌊 海洋生態專家（5🐟）</button><button onclick="buySkill(${i},'tech')">🎣 捕魚技術指導（8🐟）</button><button onclick="buySkill(${i},'ship')">🚢 增建船舶工程（10🐟）</button></p>`).join("")}else sk.classList.add("hide");if(s.phase==="end"){$("final").classList.remove("hide");$("final").innerHTML="<h2>🏆 最終排名</h2>"+Object.values(s.teams).sort((a,b)=>b.fish-a.fish).map((t,i)=>`<div class=rank>${i+1}. ${t.name}　${t.fish}🐟</div>`).join("")}}else{let t=s.teams[me];$("studentName").textContent=t.name;$("studentInfo").innerHTML=`${phase()}<br>第${t.attempts}/${3+t.tech}次｜${t.fish}🐟｜🚢${t.capacity}<br>${+s.turn===me?"🟢 現在輪到你":"⏳ 等待其他組"}`;if(["p1","p2"].includes(s.phase))$("controls").innerHTML=`<select id=sea><option value=pacific>🌊太平洋</option><option value=atlantic>🌊大西洋</option><option value=indian>🌊印度洋</option></select> <button class=go onclick="catchFish()">🎣 抽魚牌</button>`;else if(["training","upgrade"].includes(s.phase))$("controls").innerHTML=`<button onclick="buySkill(${me},'expert')">🌊海洋生態專家5🐟</button><button onclick="buySkill(${me},'tech')">🎣捕魚技術指導8🐟</button><button onclick="buySkill(${me},'ship')">🚢增建船舶工程10🐟</button>`;else $("controls").innerHTML="等待教師操作";$("myEvent").innerHTML=s.last&&s.last.team===t.name?event(s.last):"🃏 等待你的抽牌結果"}}
window.copyCode=()=>{navigator.clipboard?.writeText(s.code);alert(s.code)};window.copyLink=()=>{navigator.clipboard?.writeText(location.href.split("#")[0]+"#join="+s.code);alert("學生網址已複製")};
</script></body></html>
